<script>
(function () {
  if (AA.failIfMissing()) return;
  AA.initTheme();
  const D = AA.D;
  const fmt = AA.fmt;
  const esc = AA.esc;
  const P = AA.PROVIDER_IDS;
  const C = D.meta.counts;
  const cityById = Object.fromEntries(D.cities.map((c) => [c.geoid, c]));
  const pct = (v, d = 0) => fmt.pct(v, d);
  const byP = (arr) => Object.fromEntries(arr.map((r) => [r.provider, r]));
  const range = (vals, f = pct) => {
    const lo = d3.min(vals), hi = d3.max(vals);
    return f(lo) === f(hi) ? f(lo) : `${f(lo)}–${f(hi)}`;
  };
  const NBSP = " ";

  // ---------------------------------------------------------------------
  // Chart primitives. Every chart is redrawn from scratch at the width of
  // its container; colors come from CSS tokens so both themes work.
  // ---------------------------------------------------------------------

  // Horizontal axis with hairline gridlines and a title under the plot.
  function xAxis(svg, x, { top, bottom, ticks, fmt: f, title, width }) {
    const g = svg.append("g");
    for (const t of ticks) {
      g.append("line").attr("class", "grid").attr("x1", x(t)).attr("x2", x(t)).attr("y1", top).attr("y2", bottom);
      const lab = g.append("text").attr("x", x(t)).attr("y", bottom + 14).attr("text-anchor", "middle").attr("class", "num").text(f(t));
      // Keep a tick label at either edge inside the chart instead of clipping it.
      const half = lab.node().getComputedTextLength() / 2;
      if (x(t) + half > width) lab.attr("x", width).attr("text-anchor", "end");
      else if (x(t) - half < 0) lab.attr("x", 0).attr("text-anchor", "start");
    }
    if (title) {
      const [a, b] = x.range();
      const label = g.append("text").attr("y", bottom + 32).attr("text-anchor", "middle").attr("class", "t-ink").text(title);
      const half = label.node().getComputedTextLength() / 2;
      label.attr("x", Math.min(Math.max((a + b) / 2, half), width - half));
    }
  }
  function yAxis(svg, y, { left, right, ticks, fmt: f, title }) {
    const g = svg.append("g");
    for (const t of ticks) {
      g.append("line").attr("class", "grid").attr("x1", left).attr("x2", right).attr("y1", y(t)).attr("y2", y(t));
      g.append("text").attr("x", left - 6).attr("y", y(t)).attr("dy", "0.32em").attr("text-anchor", "end").attr("class", "num").text(f(t));
    }
    if (title) {
      const [b, a] = y.range();
      g.append("text").attr("transform", `translate(12,${(a + b) / 2}) rotate(-90)`).attr("text-anchor", "middle").attr("class", "t-ink").text(title);
    }
  }
  const logTicks = (lo, hi) => [0.1, 0.3, 1, 3, 10, 30, 100, 300, 1000, 3000, 10000, 100000, 1000000].filter((t) => t >= lo && t <= hi);
  const miTick = (t) => (t >= 1000 ? `${d3.format(",")(t)}` : `${t}`);

  // Draw one row's chatbot dots on a shared baseline. Dots closer than a
  // dot's width collide; a colliding group is drawn as nested rings (first
  // chatbot outermost) so every color stays visible without moving any dot
  // off the row's line.
  function rowDots(svg, items, y) {
    const sorted = items.slice().sort((a, b) => a.x - b.x);
    const groups = [];
    for (const it of sorted) {
      const g = groups[groups.length - 1];
      if (g && it.x - g[0].x < 9) g.push(it); else groups.push([it]);
    }
    const RADII = { 1: [5], 2: [6.5, 3.6], 3: [7.5, 5, 2.6] };
    for (const g of groups) {
      const ordered = g.slice().sort((a, b) => P.indexOf(a.p) - P.indexOf(b.p));
      const cx = d3.mean(g, (d) => d.x);
      ordered.forEach((d, i) => {
        svg.append("circle").attr("cx", g.length > 1 ? cx : d.x).attr("cy", y).attr("r", RADII[g.length][i])
          .style("fill", AA.color(d.p)).style("stroke", "var(--surface)").style("stroke-width", g.length > 1 && i > 0 ? 1.2 : 2);
      });
    }
  }

  // Dot rows: one row per category, one colored dot per chatbot.
  // o.rows: [{key, label, group?}]; o.value(rowKey, provider) -> number|null;
  // o.tip(rowKey, provider) -> [title, lines]; o.x: {domain, fmt, ticks?, title, log?};
  // o.bench(rowKey) -> number|null draws a black tick (a benchmark).
  function dotRows(el, o) {
    const providers = o.providers || P;
    const rowH = o.rowH || 30, headH = 26, axisH = o.x.title ? 44 : 26, top = 6;
    let y = top;
    const lay = [];
    o.rows.forEach((r, i) => {
      if (r.group && (i === 0 || o.rows[i - 1].group !== r.group)) { lay.push({ head: r.group, y: y + headH - 8 }); y += headH; }
      lay.push({ r, y: y + rowH / 2 });
      y += rowH;
    });
    const bottom = y + 2;
    const { svg, width } = AA.svg(el, bottom + axisH);
    const narrow = width < 560;
    const labelOf = (r) => (narrow && r.short ? r.short : r.label);
    const labelW = Math.min(width * 0.46, AA.textWidth(svg, o.rows.map(labelOf)) + 14);
    const x = (o.x.log ? d3.scaleLog() : d3.scaleLinear()).domain(o.x.domain).range([labelW + 6, width - 14]).clamp(true);
    const ticks = o.x.ticks || x.ticks(Math.max(3, Math.min(6, Math.floor((width - labelW) / 90))));
    xAxis(svg, x, { top, bottom, ticks, fmt: o.x.fmt, title: o.x.title, width });
    // All dots in a row share one baseline. Where chatbots agree their dots
    // overlap (the surface ring keeps each edge visible); hovering anywhere on
    // the row lists every chatbot's value, so an overlap never hides one.
    const rowTip = (r) => {
      const lines = providers.map((p) => {
        const v = o.value(r.key, p);
        if (v == null || isNaN(v)) return `${AA.label(p)}: none`;
        const t = o.tip ? o.tip(r.key, p)[1] : [o.x.fmt(v)];
        return `${AA.label(p)}: ${t.join("; ")}`;
      });
      return [r.label, lines];
    };
    for (const L of lay) {
      if (L.head) { svg.append("text").attr("class", "t-head").attr("x", 0).attr("y", L.y).text(L.head); continue; }
      const r = L.r;
      svg.append("text").attr("x", labelW - 4).attr("y", L.y).attr("dy", "0.32em").attr("text-anchor", "end").attr("class", "t-ink").text(labelOf(r));
      const vals = providers.map((p) => o.value(r.key, p)).filter((v) => v != null && !isNaN(v));
      if (vals.length > 1) svg.append("line").attr("class", "rowline").attr("x1", x(d3.min(vals))).attr("x2", x(d3.max(vals))).attr("y1", L.y).attr("y2", L.y);
      const b = o.bench ? o.bench(r.key) : null;
      if (b != null) svg.append("line").attr("class", "bench").attr("x1", x(b)).attr("x2", x(b)).attr("y1", L.y - 10).attr("y2", L.y + 10);
      rowDots(svg, providers.map((p) => ({ p, v: o.value(r.key, p) })).filter((d) => d.v != null && !isNaN(d.v)).map((d) => ({ p: d.p, x: x(d.v) })), L.y);
      svg.append("rect").attr("class", "hit").attr("x", 0).attr("y", L.y - rowH / 2).attr("width", width).attr("height", rowH)
        .on("mousemove", (e) => { const t = rowTip(r); AA.tip.show(e, t[0], t[1]); })
        .on("mouseleave", () => AA.tip.hide());
    }
    return svg;
  }

  // Lines with a hover crosshair. o.series: [{key, label, color, width, opacity, points:[{x,y}], step}]
  function lines(el, o) {
    const height = o.height || 300;
    const { svg, width } = AA.svg(el, height);
    const m = { l: o.y.title ? 58 : 44, r: 16, t: 10, b: o.x.title ? 46 : 26 };
    const x = (o.x.log ? d3.scaleLog() : d3.scaleLinear()).domain(o.x.domain).range([m.l, width - m.r]).clamp(true);
    const y = d3.scaleLinear().domain(o.y.domain).range([height - m.b, m.t]);
    yAxis(svg, y, { left: m.l, right: width - m.r, ticks: o.y.ticks || y.ticks(5), fmt: o.y.fmt, title: o.y.title });
    xAxis(svg, x, { top: m.t, bottom: height - m.b, ticks: o.x.ticks || x.ticks(6), fmt: o.x.fmt, title: o.x.title, width });
    for (const ref of o.refX || []) {
      svg.append("line").attr("x1", x(ref.x)).attr("x2", x(ref.x)).attr("y1", m.t).attr("y2", height - m.b).style("stroke", "var(--ink)").style("stroke-width", 1);
      // A label at the bottom stays clear of curves that crowd the top.
      svg.append("text").attr("x", x(ref.x) + 5).attr("y", ref.bottom ? height - m.b - 8 : m.t + 10).attr("class", "t-ink").text(ref.label);
    }
    const line = (s) => (s.step ? d3.line().curve(d3.curveStepAfter) : d3.line()).x((d) => x(d.x)).y((d) => y(d.y));
    for (const s of o.series) {
      svg.append("path").datum(s.points).attr("d", line(s)).style("fill", "none").style("stroke", s.color)
        .style("stroke-width", s.width || 2).style("stroke-opacity", s.opacity || 1).style("stroke-linejoin", "round").style("stroke-linecap", "round");
    }
    // Crosshair.
    const cross = svg.append("line").attr("class", "cross").attr("y1", m.t).attr("y2", height - m.b).style("opacity", 0);
    const yAt = (s, xv) => {
      const i = d3.bisector((d) => d.x).right(s.points, xv) - 1;
      if (i < 0) return s.step ? 0 : null;
      if (s.step || i === s.points.length - 1) return s.points[i].y;
      const a = s.points[i], b = s.points[i + 1];
      return a.y + (b.y - a.y) * ((xv - a.x) / (b.x - a.x));
    };
    svg.append("rect").attr("x", m.l).attr("y", m.t).attr("width", width - m.l - m.r).attr("height", height - m.t - m.b).style("fill", "transparent")
      .on("mousemove", (e) => {
        const [mx] = d3.pointer(e);
        const xv = x.invert(mx);
        cross.attr("x1", mx).attr("x2", mx).style("opacity", 1);
        const rows = o.series.filter((s) => !s.noTip).map((s) => `${s.label}: ${o.y.fmt(yAt(s, xv))}`);
        AA.tip.show(e, o.x.hoverFmt ? o.x.hoverFmt(xv) : o.x.fmt(xv), rows);
      })
      .on("mouseleave", () => { cross.style("opacity", 0); AA.tip.hide(); });
    return { svg, x, y };
  }

  // Scatter with optional reference lines. o.points: [{x, y, color, hollow, tip:[title, lines]}]
  // o.square makes the plot area square (equal pixel length on both axes),
  // so with equal axis domains the y = x line runs at exactly 45 degrees.
  function scatter(el, o) {
    const m = { l: 60, r: 14, t: 10, b: 46 };
    let height = o.height || 320, svg, width;
    if (o.square) {
      const side = Math.min(Math.max(260, el.clientWidth) - m.l - m.r, o.maxSide || 460);
      width = side + m.l + m.r;
      height = side + m.t + m.b;
      el.querySelectorAll("svg").forEach((n) => n.remove());
      // A fixed pixel width (shrinking on small screens) keeps the plot square.
      svg = d3.select(el).append("svg").attr("viewBox", `0 0 ${width} ${height}`).attr("width", width)
        .style("max-width", "100%").style("height", "auto").attr("role", "img");
    } else {
      ({ svg, width } = AA.svg(el, height));
    }
    const sx = (o.x.log ? d3.scaleLog() : d3.scaleLinear()).domain(o.x.domain).range([m.l, width - m.r]).clamp(true);
    const sy = (o.y.log ? d3.scaleLog() : d3.scaleLinear()).domain(o.y.domain).range([height - m.b, m.t]).clamp(true);
    yAxis(svg, sy, { left: m.l, right: width - m.r, ticks: o.y.ticks || sy.ticks(5), fmt: o.y.fmt, title: o.y.title });
    xAxis(svg, sx, { top: m.t, bottom: height - m.b, ticks: o.x.ticks || sx.ticks(5), fmt: o.x.fmt, title: o.x.title, width });
    const clip = `clip-${Math.random().toString(36).slice(2)}`;
    svg.append("clipPath").attr("id", clip).append("rect").attr("x", m.l).attr("y", m.t).attr("width", width - m.l - m.r).attr("height", height - m.t - m.b);
    const ref = svg.append("g").attr("clip-path", `url(#${clip})`);
    const xs = d3.range(0, 201).map((i) => o.x.domain[0] * Math.pow(o.x.domain[1] / o.x.domain[0], i / 200));
    for (const band of o.bands || []) {
      const area = d3.area().x((v) => sx(v)).y0((v) => sy(band.lo(v))).y1((v) => sy(band.hi(v)));
      ref.append("path").datum(xs).attr("d", area).style("fill", "var(--ink)").style("fill-opacity", 0.07);
    }
    for (const rl of o.refLines || []) {
      ref.append("path").datum(xs).attr("d", d3.line().x((v) => sx(v)).y((v) => sy(rl.fn(v)))).style("fill", "none").style("stroke", "var(--ink)").style("stroke-width", 1);
      // On very small plots the legend names the line instead of a label.
      if (rl.label && (rl.along ? width - m.l - m.r >= 300 : width >= 320)) {
        const xv = rl.at || o.x.domain[1] / 3;
        const t = svg.append("text").attr("class", "t-ink").text(rl.label);
        if (rl.along) {
          // Written along the line, just below it.
          const x2 = o.x.log ? xv * 2 : xv + 1;
          const angle = Math.atan2(sy(rl.fn(x2)) - sy(rl.fn(xv)), sx(x2) - sx(xv)) * 180 / Math.PI;
          t.attr("transform", `translate(${sx(xv)},${sy(rl.fn(xv))}) rotate(${angle})`).attr("y", 17).attr("text-anchor", "start");
        } else if (rl.below) t.attr("x", sx(xv)).attr("y", sy(rl.fn(xv)) + 16).attr("text-anchor", "start");
        else t.attr("x", sx(xv) + 6).attr("y", sy(rl.fn(xv)) - 6);
      }
    }
    const g = svg.append("g");
    for (const p of o.points) {
      g.append("circle").attr("cx", sx(p.x)).attr("cy", sy(p.y)).attr("r", o.r || 3.6)
        .style("fill", p.hollow ? "var(--surface)" : p.color).style("fill-opacity", p.hollow ? 1 : (o.opacity || 0.75))
        .style("stroke", p.hollow ? p.color : "var(--surface)").style("stroke-width", p.hollow ? 1.5 : 0.8)
        .on("mousemove", (e) => AA.tip.show(e, p.tip[0], p.tip[1]))
        .on("mouseleave", () => AA.tip.hide());
    }
    return { svg, sx, sy };
  }

  // A figure skeleton: title, legend, panels, caption, and a table view.
  function figure(container, { title, legend, panels, two, caption, table }) {
    const fig = document.createElement("figure");
    fig.className = "fig";
    fig.innerHTML = `${title ? `<div class="fig-title">${title}</div>` : ""}
      ${legend ? `<div class="fig-legend legend"></div>` : ""}
      <div class="panels ${two ? "two" : ""}">${panels.map((p, i) => `<div class="panel${p.wide ? " wide" : ""}">
        ${p.title ? `<div class="ph">${p.letter ? `<span class="pl">${p.letter}</span>` : ""}<span>${p.title}</span></div>` : ""}
        ${p.controls ? `<div class="ctl"></div>` : ""}
        <div class="chart" data-i="${i}"></div>
        ${p.sub ? `<div class="sub">${p.sub}</div>` : ""}</div>`).join("")}</div>
      <figcaption>${caption}</figcaption>
      ${table ? `<details class="tv"><summary>Show the numbers</summary><div class="table-wrap"></div></details>` : ""}`;
    container.appendChild(fig);
    if (legend) {
      const lg = fig.querySelector(".fig-legend");
      if (legend === "providers") AA.providerLegend(lg); else AA.legend(lg, legend);
    }
    if (table) {
      const t = table();
      fig.querySelector(".table-wrap").innerHTML = `<table class="data"><thead><tr>${t.columns.map((c, i) => `<th class="${i && t.numeric !== false ? "n" : ""}">${esc(c)}</th>`).join("")}</tr></thead>
        <tbody>${t.rows.map((r) => `<tr>${r.map((v, i) => `<td class="${i && t.numeric !== false ? "n" : ""}">${esc(v)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
    }
    return [...fig.querySelectorAll(".chart")];
  }

  // Jittered points with a box plot on a log axis, one row per group.
  // o.rows: [{key, label, group?, points: [{v, color, tip:[title, lines]}]}];
  // o.x: {domain, ticks, fmt, title}. Quartiles are of the raw values (a log
  // scale does not change them); whiskers use Tukey's 1.5 x IQR rule on the
  // log10 values, so they are symmetric on the axis the reader sees, and end
  // at the most extreme point inside the fences.
  function jitterBox(el, o) {
    const rowH = o.rowH || 46, headH = 26, axisH = 44, top = 20; // room for the "Median" heading
    let y = top;
    const lay = [];
    o.rows.forEach((r, i) => {
      if (r.group && (i === 0 || o.rows[i - 1].group !== r.group)) { lay.push({ head: r.group, y: y + headH - 8 }); y += headH; }
      lay.push({ r, y: y + rowH / 2 });
      y += rowH;
    });
    const bottom = y + 2;
    const { svg, width } = AA.svg(el, bottom + axisH);
    const stats = (vals) => {
      const v = vals.slice().sort(d3.ascending);
      const lv = v.map(Math.log10);
      const q1 = d3.quantile(lv, 0.25), q3 = d3.quantile(lv, 0.75), iqr = q3 - q1;
      const inside = lv.filter((x) => x >= q1 - 1.5 * iqr && x <= q3 + 1.5 * iqr);
      return {
        n: v.length, q1: d3.quantile(v, 0.25), med: d3.median(v), q3: d3.quantile(v, 0.75),
        lo: Math.pow(10, d3.min(inside)), hi: Math.pow(10, d3.max(inside)),
      };
    };
    const S = new Map(o.rows.map((r) => [r.key, stats(r.points.map((d) => d.v))]));
    // On narrow screens: short row labels, fewer ticks, a shorter axis title.
    const narrow = width < 560;
    const labelOf = (r) => (narrow && r.short ? r.short : r.label);
    const labelW = Math.min(width * 0.4, AA.textWidth(svg, o.rows.map(labelOf)) + 14);
    const rightW = AA.textWidth(svg, o.rows.map((r) => `${fmt.mi(S.get(r.key).med)}`), "t-strong") + 14;
    svg.append("text").attr("x", width).attr("y", 8).attr("dy", "0.32em").attr("text-anchor", "end").attr("class", "t-muted").text("Median");
    const x = d3.scaleLog().domain(o.x.domain).range([labelW + 8, width - rightW - 8]).clamp(true);
    xAxis(svg, x, {
      top, bottom, ticks: narrow && o.x.ticksNarrow ? o.x.ticksNarrow : o.x.ticks, fmt: o.x.fmt,
      title: narrow && o.x.titleNarrow ? o.x.titleNarrow : o.x.title, width: width - rightW,
    });
    const half = Math.min(15, rowH / 2 - 5);
    for (const L of lay) {
      if (L.head) { svg.append("text").attr("class", "t-head").attr("x", 0).attr("y", L.y).text(L.head); continue; }
      const r = L.r, st = S.get(r.key), cy = L.y;
      svg.append("text").attr("x", labelW - 4).attr("y", cy).attr("dy", "0.32em").attr("text-anchor", "end").attr("class", "t-ink").text(labelOf(r));
      // Points, jittered vertically with a fixed seed so redraws match.
      const rand = d3.randomLcg(d3.sum(String(r.key), (ch) => ch.charCodeAt(0)) / 997 % 1);
      const g = svg.append("g");
      for (const d of r.points) {
        const jy = cy + (rand() * 2 - 1) * (half - 2);
        g.append("circle").attr("cx", x(d.v)).attr("cy", jy).attr("r", 2.4)
          .style("fill", d.color).style("fill-opacity", 0.5)
          .on("mousemove", (e) => AA.tip.show(e, d.tip[0], d.tip[1])).on("mouseleave", () => AA.tip.hide());
      }
      // Box: whiskers, interquartile box, median.
      const b = svg.append("g").style("pointer-events", "none");
      b.append("line").attr("x1", x(st.lo)).attr("x2", x(st.q1)).attr("y1", cy).attr("y2", cy).style("stroke", "var(--ink)").style("stroke-width", 1.2);
      b.append("line").attr("x1", x(st.q3)).attr("x2", x(st.hi)).attr("y1", cy).attr("y2", cy).style("stroke", "var(--ink)").style("stroke-width", 1.2);
      for (const w of [st.lo, st.hi]) b.append("line").attr("x1", x(w)).attr("x2", x(w)).attr("y1", cy - 5).attr("y2", cy + 5).style("stroke", "var(--ink)").style("stroke-width", 1.2);
      b.append("rect").attr("x", x(st.q1)).attr("y", cy - half).attr("width", Math.max(1, x(st.q3) - x(st.q1))).attr("height", half * 2).attr("rx", 3)
        .style("fill", "var(--surface)").style("fill-opacity", 0.35).style("stroke", "var(--ink)").style("stroke-width", 1.4);
      b.append("line").attr("x1", x(st.med)).attr("x2", x(st.med)).attr("y1", cy - half).attr("y2", cy + half).style("stroke", "var(--ink)").style("stroke-width", 2.6);
      svg.append("text").attr("x", width).attr("y", cy).attr("dy", "0.32em").attr("text-anchor", "end").attr("class", "t-strong num").text(fmt.mi(st.med));
      // The box itself answers hover with its summary.
      svg.append("rect").attr("x", x(st.q1)).attr("y", cy - half).attr("width", Math.max(6, x(st.q3) - x(st.q1))).attr("height", half * 2).attr("class", "hit")
        .on("mousemove", (e) => AA.tip.show(e, r.tipTitle || r.label, [`${st.n} places`, `Median ${fmt.mi(st.med)}`, `Middle half ${fmt.mi(st.q1)} to ${fmt.mi(st.q3)}`, `Whiskers ${fmt.mi(st.lo)} to ${fmt.mi(st.hi)}`]))
        .on("mouseleave", () => AA.tip.hide());
    }
    return svg;
  }

  // Empirical cumulative distribution as step points.
  function ecdf(values) {
    const v = values.filter((d) => d != null && !isNaN(d)).sort((a, b) => a - b);
    const n = v.length;
    return v.map((d, i) => ({ x: d, y: (i + 1) / n }));
  }

  const GROUPS = [

      const lawNot = P.map((p) => {

          How the audit was run is described on the <a href="pilot_4cities_approach.html">approach page</a>, and every answer can be read in the

        ["websites", `${fmt.int(web.gemini.median)} vs ${fmt.int(web.openai.median)} vs ${fmt.int(web.anthropic.median)}`, "median websites shown per answer by Gemini, ChatGPT, and Claude. Only Gemini showed crisis pregnancy center sites."],
      ];
      root.querySelector("#ov-cards").innerHTML = cards.map(([tab, big, text]) => {

        return `<button class="card" type="button" data-go="${tab}"><span class="q">${esc(t.nav)}</span><span class="big">${esc(big)}</span><p>${esc(text)}</p></button>`;

        including ${fmt.int(d3.sum(D.law.table.filter((r) => r.provider === "openai" && r.policy_group === "Total ban" && r.state_law_claim === "not_stated"), (r) => r.n))}

          same three facilities; 9 would mean no overlap at all.`,
        table: () => ({
          columns: ["Places", "Named by 1", "Named by 2", "Named by all 3"],
          rows: [["All", null], ["Total-ban states", true], ["Other states", false]].map(([lab, ban]) => {
            const cs = A.cities.filter((c) => ban == null || c.total_ban === ban);
            return [lab, d3.sum(cs, (c) => c.by_1), d3.sum(cs, (c) => c.by_2), d3.sum(cs, (c) => c.by_3)];
          }),
        }),
      });
      // a: 100% stacked bars (ordinal blue ramp: 1 = lightest, 3 = darkest).
      const segs = [{ k: "by_1", label: "1 chatbot", c: "#86b6ef" }, { k: "by_2", label: "2 chatbots", c: "#2a78d6" }, { k: "by_3", label: "All 3", c: "#104281" }];
      const groups = [["All places", null], ["Total-ban states", true], ["Other states", false]];
      (function () {
        const { svg, width } = AA.svg(c1, groups.length * 40 + 70);
        const labelW = AA.textWidth(svg, groups.map((g) => g[0])) + 16;
        const x = d3.scaleLinear().domain([0, 1]).range([labelW, width - 12]);
        const leg = svg.append("g");
        let lx = labelW;
        segs.forEach((s) => {
          leg.append("rect").attr("x", lx).attr("y", 0).attr("width", 10).attr("height", 10).attr("rx", 2).style("fill", s.c);
          const t = leg.append("text").attr("x", lx + 14).attr("y", 9).text(s.label);
          lx += 14 + t.node().getComputedTextLength() + 16;
        });
        groups.forEach(([lab, ban], i) => {
          const cs = A.cities.filter((c) => ban == null || c.total_ban === ban);
          const tot = d3.sum(cs, (c) => c.by_1 + c.by_2 + c.by_3);
          const y = 24 + i * 40;
          svg.append("text").attr("x", labelW - 8).attr("y", y + 12).attr("dy", "0.32em").attr("text-anchor", "end").attr("class", "t-ink").text(lab);
          let acc = 0;
          segs.forEach((s) => {
            const v = d3.sum(cs, (c) => c[s.k]) / tot;
            const x0 = x(acc), w = Math.max(0, x(acc + v) - x(acc) - 2);
            svg.append("rect").attr("x", x0).attr("y", y).attr("width", w).attr("height", 24).attr("rx", 3).style("fill", s.c)
              .on("mousemove", (e) => AA.tip.show(e, lab, [`Named by ${s.label.toLowerCase()}: ${pct(v, 1)} of ${tot} facilities`])).on("mouseleave", () => AA.tip.hide());
            const t = svg.append("text").attr("x", x0 + w / 2).attr("y", y + 12).attr("dy", "0.32em").attr("text-anchor", "middle").style("fill", s.k === "by_1" ? "#0b0b0b" : "#ffffff").style("pointer-events", "none").text(pct(v));
            if (t.node().getComputedTextLength() + 8 > w) t.remove();
            acc += v;
          });
        });
        xAxis(svg, x, { top: 20, bottom: 24 + groups.length * 40 - 10, ticks: [0, 0.25, 0.5, 0.75, 1], fmt: (v) => pct(v), title: "", width });
      })();
      // b: three small 3x3 matrices.
      (function () {
        const sets = [["All places", A.pairs_all], ["Total-ban states", A.pairs.filter((r) => r.total_ban)], ["Other states", A.pairs.filter((r) => !r.total_ban)]];
        const { svg, width } = AA.svg(c2, 190);
        // Width used: 40 (row dots) + 3 blocks of (3 cells + 36) + 2 gaps of 0.6 cell.
        const cell = Math.min(34, (width - 148) / 10.2);
        const blockW = cell * 3 + 36;
        sets.forEach(([lab, rows], b) => {
          const ox = 40 + b * (blockW + cell * 0.6), oy = 40;
          svg.append("text").attr("x", ox + cell * 1.5).attr("y", 14).attr("text-anchor", "middle").attr("class", "t-head").text(lab);
          P.forEach((p, j) => svg.append("circle").attr("cx", ox + cell * j + cell / 2).attr("cy", oy - 10).attr("r", 4.5).style("fill", AA.color(p)));
          P.forEach((p, i) => {
            if (b === 0) svg.append("circle").attr("cx", ox - 12).attr("cy", oy + cell * i + cell / 2).attr("r", 4.5).style("fill", AA.color(p));
            P.forEach((q, j) => {
              const r = rows.find((d) => (d.a === p && d.b === q) || (d.a === q && d.b === p));
              const v = p === q ? 1 : r ? r.mean_jaccard : null;
              const x0 = ox + cell * j, y0 = oy + cell * i;
              svg.append("rect").attr("x", x0 + 1).attr("y", y0 + 1).attr("width", cell - 2).attr("height", cell - 2).attr("rx", 3)
                .style("fill", p === q ? "var(--grid)" : "#2a78d6").style("fill-opacity", p === q ? 1 : 0.15 + 0.85 * v);
              if (p !== q) {
                svg.append("text").attr("x", x0 + cell / 2).attr("y", y0 + cell / 2).attr("dy", "0.32em").attr("text-anchor", "middle").style("fill", v > 0.55 ? "#fff" : "var(--ink)").style("font-size", "10.5px").text(pct(v));
                svg.append("rect").attr("x", x0).attr("y", y0).attr("width", cell).attr("height", cell).attr("class", "hit")
                  .on("mousemove", (e) => AA.tip.show(e, `${AA.label(p)} and ${AA.label(q)}`, [lab, `Mean overlap ${pct(v, 1)}`])).on("mouseleave", () => AA.tip.hide());
              }
            });
          });
        });
        svg.append("text").attr("x", 40).attr("y", 40 + cell * 3 + 22).attr("class", "t-muted").text(width < 560 ? "Darker = more overlap" : "Rows and columns: Claude, Gemini, ChatGPT (dots). Darker = more overlap.");
      })();
      // c: histogram of distinct facilities per place.
      (function () {
        const counts = d3.rollup(A.cities, (v) => v.length, (c) => c.n_facilities);
        const ks = d3.range(2, 10);
        const { svg, width } = AA.svg(c3, 220);
        const m = { l: 44, r: 10, t: 16, b: 42 };
        const x = d3.scaleBand().domain(ks).range([m.l, width - m.r]).padding(0.3);
        const ymax = d3.max(ks, (k) => counts.get(k) || 0);
        const y = d3.scaleLinear().domain([0, ymax]).nice().range([220 - m.b, m.t]);
        yAxis(svg, y, { left: m.l, right: width - m.r, ticks: y.ticks(4), fmt: (v) => v, title: "" });
        ks.forEach((k) => {
          const n = counts.get(k) || 0;
          const bw = Math.min(24, x.bandwidth());
          const bx = x(k) + (x.bandwidth() - bw) / 2;
          if (n) {
            svg.append("path").attr("d", `M${bx},${y(0)}V${y(n) + 4}q0,-4 4,-4h${bw - 8}q4,0 4,4V${y(0)}Z`).style("fill", "var(--ink)")
              .on("mousemove", (e) => AA.tip.show(e, `${k} distinct facilities`, [`${n} places`])).on("mouseleave", () => AA.tip.hide());
            svg.append("text").attr("x", bx + bw / 2).attr("y", y(n) - 5).attr("text-anchor", "middle").attr("class", "t-ink num").text(n);
          }
          svg.append("text").attr("x", x(k) + x.bandwidth() / 2).attr("y", 220 - m.b + 14).attr("text-anchor", "middle").attr("class", "num").text(k);
        });
        svg.append("text").attr("x", (m.l + width - m.r) / 2).attr("y", 220 - 8).attr("text-anchor", "middle").attr("class", "t-ink").text(width < 560 ? "Distinct facilities (3 = full agreement)" : "Distinct facilities across the three answers (3 = full agreement)");
        svg.append("text").attr("transform", `translate(12,${(220 - m.b + m.t) / 2}) rotate(-90)`).attr("text-anchor", "middle").attr("class", "t-ink").text("Places");
      })();
    },
  });

  // 10. Guidance ----------------------------------------------------------
  TABS.push({
    id: "guidance", nav: "What else do they say?",
    question: "What guidance comes with the list of places?",
    how: `Beyond the places themselves, the coding agents recorded whether each answer says the user may need to travel to another state, mentions
      a limit tied to weeks of pregnancy, mentions help paying (abortion funds, sliding-scale fees, Medicaid), mentions abortion pills by mail or
      telehealth, asks the user a follow-up question, or states the law in the user's state. We compare how often each chatbot does each.`,
    finding() {
      const f = D.guidance.flags;
      const sh = (p, flag, ban) => { const r = f.find((d) => d.provider === p && d.flag === flag && d.total_ban === ban); return r.k / r.n; };
      return `Claude and Gemini surround their lists with practical guidance; ChatGPT gives much less. For users in total-ban states, Claude and Gemini mention
        pills by mail or telehealth in ${pct(sh("anthropic", "mentions_telehealth", true))} and ${pct(sh("gemini", "mentions_telehealth", true))} of answers; ChatGPT
        in ${pct(sh("openai", "mentions_telehealth", true))}. Claude asks a follow-up question (usually for a ZIP code or how far along the pregnancy is) in
        ${pct(sh("anthropic", "asks_follow_up", false))} of answers; Gemini never does.`;
    },
    figure(root) {
      const f = D.guidance.flags;
      const flags = [...new Set(f.map((d) => d.flag))].map((k) => ({ key: k, label: f.find((d) => d.flag === k).label }));
      const GUIDE_SHORT = {
        says_travel_needed: "Travel needed", mentions_gestational_limits: "Weeks limit", mentions_financial_help: "Help paying",
        mentions_telehealth: "Pills by mail", asks_follow_up: "Follow-up question", law_stated: "States the law",
      };
      const [c1, c2] = figure(root, {
        legend: "providers", two: true,
        panels: [{ letter: "a", title: GROUPS[0].label }, { title: GROUPS[1].label }],
        caption: `<b>Guidance that accompanies the places.</b> Share of each chatbot's answers that do each thing, for users in the ${C.total_ban_states}
          total-ban states (<b>a</b>, left; ${f.find((d) => d.total_ban).n} answers per chatbot) and in all other states (right;
          ${f.find((d) => !d.total_ban).n} answers per chatbot). <i>Weeks limit</i> means any mention of a gestational limit, such as “up to 12 weeks” or
          “banned after six weeks”. <i>Help paying</i> includes abortion funds, sliding-scale fees, and Medicaid. A follow-up question asks the user for more
          information (a ZIP code, a neighborhood, weeks of pregnancy) after or instead of answering.`,
        table: () => ({
          columns: ["Users", "Guidance", ...P.map(AA.label)],
          rows: GROUPS.flatMap((g) => flags.map((fl) => [g.label, fl.label, ...P.map((p) => { const r = f.find((d) => d.provider === p && d.flag === fl.key && d.total_ban === g.key); return `${r.k} of ${r.n}`; })])),
        }),
      });
      [c1, c2].forEach((el, i) => {
        const g = GROUPS[i];
        const v = (k, p) => { const r = f.find((d) => d.provider === p && d.flag === k && d.total_ban === g.key); return r.k / r.n; };
        dotRows(el, {
          rows: flags.map((fl) => ({ key: fl.key, short: GUIDE_SHORT[fl.key], label: fl.label.replace("Says travel to another state may be needed", "Says travel may be needed").replace("Mentions a gestational (weeks) limit", "Mentions a weeks limit").replace("Mentions help paying (funds, Medicaid)", "Mentions help paying").replace("Mentions pills by mail or telehealth", "Mentions pills by mail").replace("Asks the user a follow-up question", "Asks a follow-up question").replace("States the law in the user's state", "States the state's law") })),
          value: v,
          tip: (k, p) => [AA.label(p), [`${flags.find((x) => x.key === k).label}: ${pct(v(k, p))}`]],
          x: { domain: [0, 1], ticks: [0, 0.5, 1], fmt: (x) => pct(x), title: "Share of answers" },
        });
      });
    },
  });

  // 11. Websites ----------------------------------------------------------
  TABS.push({
    id: "websites", nav: "Which websites do readers see?",
    question: "Which websites do readers see, and who runs them?",
    how: `We counted every website an answer shows its reader: formal citations, links in the text, and sites named without a link. Search results the
      chatbot read but did not show are not counted. Each distinct site (${fmt.int(C.domains)} in all) was visited and coded by an AI agent for the type
      of organization behind it and whether it is affiliated with crisis pregnancy centers.`,
    finding() {
      const W = D.websites;
      const w = byP(W.per_response);
      const cpcN = d3.sum(D.websites.cpc, (d) => d.n);
      const cpcSites = new Set(D.websites.cpc.map((d) => d.domain)).size;
      return `The chatbots differ most here. Gemini shows a median of ${fmt.int(w.gemini.median)} websites per answer, ChatGPT ${fmt.int(w.openai.median)}, and
        Claude ${fmt.int(w.anthropic.median)}. Most are abortion directories and providers. Only Gemini showed crisis pregnancy center websites
        (${fmt.int(cpcN)} appearances from ${fmt.int(cpcSites)} sites), and ${fmt.int(W.cpc_citations.n_warning)} of its ${fmt.int(W.cpc_citations.n_citations)}
        citations of those sites back a sentence that warns readers about such centers.`;
    },
    figure(root) {
      const W = D.websites;
      const w = byP(W.per_response);
      const totals = Object.fromEntries(P.map((p) => [p, d3.sum(W.categories.filter((r) => r.provider === p), (r) => r.n)]));
      const GROUPS_W = [
        { key: "dir", label: "Abortion directory", cats: ["abortion_directory"] },
        { key: "prov", label: "Abortion provider", cats: ["abortion_provider", "telehealth_abortion_provider"] },
        { key: "fund", label: "Fund or support", cats: ["abortion_fund_or_support"] },
        { key: "adv", label: "Advocacy or research", cats: ["advocacy_or_research"] },
        { key: "gov", label: "Government", cats: ["government"] },
        { key: "med", label: "Hospital or other medical", cats: ["hospital_or_health_system", "other_medical_practice"] },
        { key: "news", label: "News or reference", cats: ["news_media", "reference"] },
        { key: "cpc", label: "Crisis pregnancy center", cats: ["crisis_pregnancy_center"] },
        { key: "other", label: "Other or unclear", cats: ["other", "unclear", "business_listing", "social_media_or_forum"] },
      ];
      const share = (k, p) => d3.sum(W.categories.filter((r) => r.provider === p && GROUPS_W.find((g) => g.key === k).cats.includes(r.category)), (r) => r.n) / totals[p];
      const [c1, c2, c3] = figure(root, {
        legend: "providers", two: true,
        panels: [
          { letter: "a", title: "Websites shown per answer" },
          { letter: "b", title: "Who runs the websites shown" },
          { letter: "c", title: "The most-shown websites", wide: true },
        ],
        caption: `<b>Websites shown to readers.</b> <b>a</b>, Website appearances per answer: the dot is the median and the line spans the middle half of
          answers (25th to 75th percentile); the number at right is the mean. A site counts again each time it appears; a link that repeats a citation is
          counted once. <b>b</b>, Share of each chatbot's website appearances by the type of organization behind the site (Claude:
          ${fmt.int(totals.anthropic)} appearances; Gemini: ${fmt.int(totals.gemini)}; ChatGPT: ${fmt.int(totals.openai)}). <b>c</b>, The 15 most-shown sites
          overall, by chatbot (log scale; a missing dot means the chatbot never showed the site). Organization types were coded by AI agents that visited
          each site; crisis pregnancy center (CPC) affiliation includes networks and directories run for CPCs. A citation counts as backing a warning when
          the cited sentence contains words such as “crisis pregnancy center”, “do not provide”, or “avoid”, a keyword rule not yet checked by hand. CPC sites shown by Gemini:
          ${W.cpc.slice(0, 6).map((d) => `${esc(d.domain)} (${d.n})`).join(", ")}${W.cpc.length > 6 ? `, and ${W.cpc.length - 6} more` : ""}.`,
        table: () => ({
          columns: ["Website", "Type", ...P.map(AA.label), "Total"],
          rows: W.top_domains.map((d) => [d.domain, (d.category || "").replace(/_/g, " "), d.anthropic || 0, d.gemini || 0, d.openai || 0, d.total]),
        }),
      });
      // a: median and interquartile range per chatbot.
      (function () {
        const rows = P;
        const { svg, width } = AA.svg(c1, rows.length * 34 + 56);
        const labelW = AA.textWidth(svg, rows.map(AA.label)) + 16;
        const meanW = AA.textWidth(svg, rows.map((p) => `mean ${fmt.dec(w[p].mean)}`)) + 12;
        const x = d3.scaleLinear().domain([0, 35]).range([labelW, width - meanW - 8]);
        const bottom = 8 + rows.length * 34;
        xAxis(svg, x, { top: 6, bottom, ticks: [0, 10, 20, 30], fmt: (v) => v, title: "Websites shown per answer", width: width - meanW });
        rows.forEach((p, i) => {
          const y = 8 + i * 34 + 17;
          const r = w[p];
          svg.append("text").attr("x", labelW - 8).attr("y", y).attr("dy", "0.32em").attr("text-anchor", "end").attr("class", "t-ink").text(AA.label(p));
          svg.append("line").attr("x1", x(r.q25)).attr("x2", x(r.q75)).attr("y1", y).attr("y2", y).style("stroke", AA.color(p)).style("stroke-width", 4).style("stroke-linecap", "round").style("stroke-opacity", 0.5);
          svg.append("circle").attr("class", "dot").attr("cx", x(r.median)).attr("cy", y).attr("r", 6).style("fill", AA.color(p));
          svg.append("text").attr("x", width - meanW).attr("y", y).attr("dy", "0.32em").attr("class", "t-ink num").text(`mean ${fmt.dec(r.mean)}`);
          svg.append("rect").attr("x", labelW).attr("y", y - 14).attr("width", Math.max(0, width - labelW - meanW)).attr("height", 28).attr("class", "hit")
            .on("mousemove", (e) => AA.tip.show(e, AA.label(p), [`Median ${fmt.dec(r.median, 0)}, middle half ${fmt.dec(r.q25, 0)}–${fmt.dec(r.q75, 0)}`, `Mean ${fmt.dec(r.mean)}`, `${r.distinct} distinct sites across all answers`]))
            .on("mouseleave", () => AA.tip.hide());
        });
      })();
      dotRows(c2, {
        rows: GROUPS_W, value: share,
        tip: (k, p) => [AA.label(p), [`${GROUPS_W.find((g) => g.key === k).label}: ${pct(share(k, p), 1)} of appearances`]],
        x: { domain: [0, 0.8], ticks: [0, 0.2, 0.4, 0.6, 0.8], fmt: (v) => pct(v), title: "Share of website appearances" }, rowH: 26,
      });
      const top = W.top_domains.slice(0, 15);
      dotRows(c3, {
        rows: top.map((d) => ({ key: d.domain, label: d.domain })),
        value: (k, p) => { const v = top.find((d) => d.domain === k)[p]; return v ? v : null; },
        tip: (k, p) => [k, [`${AA.label(p)}: ${top.find((d) => d.domain === k)[p] || 0} appearances`, (top.find((d) => d.domain === k).category || "").replace(/_/g, " ")]],
        x: { log: true, domain: [1, 1500], ticks: [1, 10, 100, 1000], fmt: (v) => d3.format(",")(v), title: "Appearances (log scale)" }, rowH: 24,
      });
    },
  });

  // ---------------------------------------------------------------------
  // Tab rendering and navigation.
  // ---------------------------------------------------------------------
  const nav = document.getElementById("tabs");
  const main = document.getElementById("main");
  TABS.forEach((t, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.setAttribute("role", "tab"); b.id = `tab-${t.id}`; b.dataset.id = t.id;
    b.innerHTML = `<span class="k">${i === 0 ? "" : i}</span><span>${esc(t.nav)}</span>`;
    nav.appendChild(b);
    const sec = document.createElement("section");
    sec.className = "tab"; sec.id = `p-${t.id}`; sec.setAttribute("role", "tabpanel"); sec.setAttribute("aria-labelledby", b.id);
    main.appendChild(sec);
  });
  function build(t, i) {
    const sec = document.getElementById(`p-${t.id}`);
    sec.replaceChildren();
    if (t.render) { t.render(sec); return; }
    sec.insertAdjacentHTML("beforeend", `<div class="eyebrow">Question ${i}</div><h1>${esc(t.question)}</h1>
      <div class="how"><p><b>How the data answer it.</b> ${t.how}</p></div>
      <p class="finding">${t.finding()}</p>`);
    t.figure(sec);
    sec.insertAdjacentHTML("beforeend", `<p class="note">Codes from AI agents, not yet checked by human coders. Built ${D.meta.generated_at}.</p>`);
  }
  let current = null;
  function show(id) {
    const i = Math.max(0, TABS.findIndex((t) => t.id === id));
    const t = TABS[i];
    current = t.id;
    nav.querySelectorAll("button").forEach((b) => b.setAttribute("aria-selected", b.dataset.id === t.id));
    // On narrow screens the tabs are a horizontal strip: keep the active one visible.
    const active = document.getElementById(`tab-${t.id}`);
    if (active && nav.scrollWidth > nav.clientWidth) nav.scrollLeft = active.offsetLeft - 16;
    main.querySelectorAll(".tab").forEach((s) => s.classList.toggle("on", s.id === `p-${t.id}`));
    build(t, i);
    history.replaceState(null, "", `#${t.id}`);
    window.scrollTo({ top: 0 });
  }
  nav.addEventListener("click", (e) => { const b = e.target.closest("button[data-id]"); if (b) show(b.dataset.id); });
  nav.addEventListener("keydown", (e) => {
    if (!["ArrowDown", "ArrowUp", "ArrowLeft", "ArrowRight"].includes(e.key)) return;
    const i = TABS.findIndex((t) => t.id === current);
    const j = Math.min(TABS.length - 1, Math.max(0, i + (e.key === "ArrowDown" || e.key === "ArrowRight" ? 1 : -1)));
    show(TABS[j].id);
    document.getElementById(`tab-${TABS[j].id}`).focus();
    e.preventDefault();
  });
  AA.onResize(() => { const i = TABS.findIndex((t) => t.id === current); build(TABS[i], i); });
  show(location.hash.slice(1) || "overview");
})();
</script>
</body>
</html>
