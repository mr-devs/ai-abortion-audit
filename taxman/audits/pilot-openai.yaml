# This is an `ai-taxman` audit file.
#
# Collect data based on this audit file by running:
#   taxman collect pilot-openai

# This audit's name, which must match this file's name.
#   Type:     string
#   Required: yes
audit: pilot-openai

# The AI provider this audit sends messages to.
#   Type:     string
#   Required: yes
provider: openai

# The name of the environment variable that holds the API key to use for this audit.
#   Type:     string
#   Required: yes
#   Example:  OPENAI_API_KEY
api_key_env: SML_OPENAI_API_KEY

# A filepath, relative to the project root, of messages to send.
#   Type:     string
#   Required: yes
messages: taxman/messages/pilot-queries.txt

# A filepath, relative to the project root, of a system prompt to send with every message.
#   Type:     string
#   Default:  blank (no system prompt)
#   Example:  taxman/prompts/neutral.txt
system_prompt:

# Where output files are written.
output:
  # Where responses and manifest are written to, relative to the project root.
  # {audit} and {run_id} are filled in at run time.
  #   Type:     string
  #   Required: yes
  dir: data/raw/audits/{audit}/{run_id}

  # Filename for the responses file in the `output` directory.
  #   Type:     string
  #   Default:  responses.jsonl
  filename: responses.jsonl

  # Gzip the responses file as it is written, adding .gz.
  #   Type:     boolean
  #   Default:  false
  compress: false

  # Path to directory where the log file is written, saved as <run_id>.log, and relative to the
  # project root.
  # {audit} and {run_id} are filled in at run time.
  #   Type:     string
  #   Required: yes
  log_dir: data/logs/taxman/{audit}

# How the messages are sent.
execution:
  # How many times each message is sent.
  #   Type:     integer, 1 or more
  #   Default:  1
  repeats: 3

  # Max number of simultaneous requests.
  #   Type:     integer, 1 or more
  #   Default:  8
  max_concurrency: 4

  # Send the messages through the provider's batch API instead of one request at a time.
  # Not available yet: true is refused before anything is sent.
  #   Type:     boolean
  #   Default:  false
  batch: false

  # Seconds to wait for a response before an attempt fails.
  #   Type:     float, more than 0
  #   Default:  120
  timeout_s: 120

  # How many times to retry a request after a rate limit, timeout, or server error.
  #   Type:     integer, 0 or more
  #   Default:  5
  max_retries: 5

  # What to do when a request fails after all retries.
  #   Options:  continue  record the failure and keep going
  #             stop      stop sending; the run ends as stopped_early
  #   Default:  continue
  on_error: continue

  # Send requests in random order instead of file order.
  #   Type:     boolean
  #   Default:  false
  shuffle: false

# Settings below are specific to the 'openai' provider.
model:
  # The model to send every message to.
  #   Type:     string
  #   Required: yes
  #   Docs:     https://developers.openai.com/api/docs/models
  name: gpt-6.1-sol

  # Sampling randomness, from focused to varied.
  # OpenAI recommends changing this or top_p, not both.
  #   Type:     float, 0 to 2
  #   Default:  blank (model default)
  #   Docs:     https://developers.openai.com/api/reference/resources/responses/methods/create
  temperature:

  # Nucleus sampling: 0.1 means only the top 10% of probability mass is considered.
  #   Type:     float, 0 to 1
  #   Default:  blank (model default)
  #   Docs:     https://developers.openai.com/api/reference/resources/responses/methods/create
  top_p:

  # Max tokens per response, reasoning tokens included.
  #   Type:     integer, 1 or more
  #   Default:  blank (model default)
  #   Docs:     https://developers.openai.com/api/reference/resources/responses/methods/create
  max_output_tokens:

  # How much the model reasons before answering.
  # Reasoning models only.
  #   Options:  none | minimal | low | medium | high | xhigh | max
  #   Default:  blank (model default)
  #   Docs:     https://developers.openai.com/api/docs/guides/reasoning
  reasoning_effort:

  # Let OpenAI keep responses on its servers.
  #   Type:     boolean
  #   Default:  false
  #   Docs:     https://developers.openai.com/api/docs/guides/your-data
  store:

  # Web search: web_search must be true to use any other setting in this block.
  #   Docs:     https://developers.openai.com/api/docs/guides/tools-web-search
  search:
    # Give the model the web search tool.
    #   Type:     boolean
    #   Default:  false
    web_search: true

    # How much search-result context the model sees.
    #   Options:  low | medium | high
    #   Default:  blank (OpenAI default)
    search_context_size:

    # Fetch live pages; false limits search to cached results.
    #   Type:     boolean
    #   Default:  blank (live)
    external_web_access:

    # How much content one search run may return.
    # GPT-5+ reasoning models only.
    #   Options:  default    the standard budget
    #             unlimited  no budget; raises latency and cost
    #   Default:  blank (the standard budget)
    return_token_budget:

    # Only search these domains, subdomains included.
    #   Type:     list of strings, up to 100
    #   Default:  blank (any domain)
    #   Example:  [cdc.gov, who.int]
    allowed_domains:

    # Never search these domains, subdomains included.
    #   Type:     list of strings, up to 100
    #   Default:  blank (none)
    #   Example:  [example.com]
    blocked_domains:

    # Approximate location to localise results.
    # Deep-research models reject it.
    user_location:
      # Two-letter country code.
      #   Type:     string
      #   Default:  blank (not sent)
      #   Example:  US
      country:

      # Region name.
      #   Type:     string
      #   Default:  blank (not sent)
      #   Example:  Minnesota
      region:

      # City name.
      #   Type:     string
      #   Default:  blank (not sent)
      #   Example:  Minneapolis
      city:

      # IANA time zone.
      #   Type:     string
      #   Default:  blank (not sent)
      #   Example:  America/Chicago
      timezone:

    # Whether the model must search.
    #   Options:  auto      the model decides
    #             required  the model searches before answering
    #   Default:  blank (auto)
    tool_choice:

    # Search data to record; [] records neither.
    #   Options:  web_search_call.action.sources  every URL consulted, not only those cited
    #             web_search_call.results         raw results, including image results
    #   Type:     list of the options above
    #   Default:  [web_search_call.action.sources]
    include:

    # Kinds of search result to request.
    # To record image results, add web_search_call.results to include.
    #   Options:  text | image
    #   Type:     list of the options above, at least 1
    #   Default:  blank (OpenAI default)
    #   Example:  [image, text]
    search_content_types:

    # Image result settings, which need image in search_content_types.
    image_settings:
      # Number of image results to request.
      #   Type:     integer, 1 or more
      #   Default:  blank (OpenAI default)
      max_results:

      # Request a short caption for each image.
      #   Type:     boolean
      #   Default:  blank (not sent)
      caption:
