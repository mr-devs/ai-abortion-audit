[project]
name = "ai-abortion-audit"
version = "0.1.0"
description = "Audit of AI model responses on abortion"
requires-python = ">=3.14"
dependencies = [
    "ai-taxman[all]==0.2.0",
    "censusgeocode>=0.5.3",
    "geopandas>=1.2.0",
    "geopy>=2.5.0",
    "jsonschema>=4.26.0",
    "pandas>=3.0.6",
    "phonenumbers>=9.0.41",
    "pyarrow>=25.0.1",
    "pygris>=0.2.1",
    "pyproj>=3.8.0",
    "rapidfuzz>=3.14.6",
    "requests>=2.34.2",
    "shapely>=2.2.0",
    "tenacity>=9.1.4",
    "tldextract>=5.4.0",
    "toolkit",
    "us>=4.0.0",
    "usaddress>=0.5.16",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.workspace]
members = [
    "code/toolkit",
]

[tool.uv.sources]
toolkit = { workspace = true, editable = true }
