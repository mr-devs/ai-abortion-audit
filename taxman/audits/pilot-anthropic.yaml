# This is an `ai-taxman` audit file.
#
# Collect data based on this audit file by running:
#   taxman collect pilot-anthropic

# This audit's name, which must match this file's name.
#   Type:     string
#   Required: yes
audit: pilot-anthropic

# The AI provider this audit sends messages to.
#   Type:     string
#   Required: yes
provider: anthropic

# The name of the environment variable that holds the API key to use for this audit.
#   Type:     string
#   Required: yes
#   Example:  ANTHROPIC_API_KEY
api_key_env: SML_ANTHROPIC_API_KEY

# A filepath, relative to the project root, of messages to send.
#   Type:     string
#   Required: yes
messages: taxman/messages/pilot-queries.txt

# A filepath, relative to the project root, of a system prompt to send with every message.
#   Type:     string
#   Default:  blank (no system prompt)
#   Example:  taxman/prompts/neutral.txt
system_prompt:

# Where output files are written.
output:
  # Where responses and manifest are written to, relative to the project root.
  # {audit} and {run_id} are filled in at run time.
  #   Type:     string
  #   Required: yes
  dir: data/raw/audits/{audit}/{run_id}

  # Filename for the responses file in the `output` directory.
  #   Type:     string
  #   Default:  responses.jsonl
  filename: responses.jsonl

  # Gzip the responses file as it is written, adding .gz.
  #   Type:     boolean
  #   Default:  false
  compress: false

  # Path to directory where the log file is written, saved as <run_id>.log, and relative to the
  # project root.
  # {audit} and {run_id} are filled in at run time.
  #   Type:     string
  #   Required: yes
  log_dir: data/logs/taxman/{audit}

# How the messages are sent.
execution:
  # How many times each message is sent.
  #   Type:     integer, 1 or more
  #   Default:  1
  repeats: 3

  # Max number of simultaneous requests.
  #   Type:     integer, 1 or more
  #   Default:  8
  max_concurrency: 4

  # Send the messages through the provider's batch API instead of one request at a time.
  # Not available yet: true is refused before anything is sent.
  #   Type:     boolean
  #   Default:  false
  batch: false

  # Seconds to wait for a response before an attempt fails.
  #   Type:     float, more than 0
  #   Default:  120
  timeout_s: 120

  # How many times to retry a request after a rate limit, timeout, or server error.
  #   Type:     integer, 0 or more
  #   Default:  5
  max_retries: 5

  # What to do when a request fails after all retries.
  #   Options:  continue  record the failure and keep going
  #             stop      stop sending; the run ends as stopped_early
  #   Default:  continue
  on_error: continue

  # Send requests in random order instead of file order.
  #   Type:     boolean
  #   Default:  false
  shuffle: false

# Settings below are specific to the 'anthropic' provider.
model:
  # The model to send every message to.
  #   Type:     string
  #   Required: yes
  #   Docs:     https://platform.claude.com/docs/en/models/overview
  name: claude-opus-5-5

  # Max tokens per response, thinking included.
  # A response that hits it is cut off.
  #   Type:     integer, 1 or more
  #   Required: yes
  #   Docs:     https://platform.claude.com/docs/en/api/messages/create
  max_tokens: 16000

  # How much effort Claude puts into a response, thinking included.
  # Levels vary by model.
  #   Options:  low     fastest and cheapest
  #             medium  balanced
  #             high    thorough
  #             xhigh   for long-horizon work
  #             max     no limit on token spending
  #   Default:  blank (model default)
  #   Docs:     https://platform.claude.com/docs/en/build-with-claude/effort
  effort:

  # Sampling randomness.
  # Models after Claude Opus 4.6 accept only 1.0.
  #   Type:     float, 0 to 1
  #   Default:  blank (model default)
  #   Docs:     https://platform.claude.com/docs/en/api/messages/create
  temperature:

  # Nucleus sampling threshold.
  # Models after Claude Opus 4.6 accept only 0.99 or more.
  #   Type:     float, 0 to 1
  #   Default:  blank (model default)
  #   Docs:     https://platform.claude.com/docs/en/api/messages/create
  top_p:

  # Sample from only the top K tokens.
  # Models after Claude Opus 4.6 reject it.
  #   Type:     integer, 1 or more
  #   Default:  blank (model default)
  #   Docs:     https://platform.claude.com/docs/en/api/messages/create
  top_k:

  # Thinking: leave every key blank for the model's default.
  #   Docs:     https://platform.claude.com/docs/en/build-with-claude/thinking
  thinking:
    # How Claude thinks before answering.
    # Modes vary by model.
    #   Options:  adaptive       Claude decides when and how much to think
    #             enabled        think up to budget_tokens; older models
    #             disabled       no thinking, where allowed
    #             between_tools  no up-front thinking; Claude Sonnet 5.5 at effort high or below
    #   Default:  blank (model default)
    type:

    # Max thinking tokens, for type: enabled only.
    # Must be less than max_tokens.
    #   Type:     integer, 1024 or more
    #   Default:  blank (not sent)
    budget_tokens:

    # Whether thinking text is returned.
    # Not with type: disabled or between_tools.
    #   Options:  summarized  a summary of the thinking
    #             omitted     empty thinking blocks
    #             updates     beta: empty thinking, plus notes between tool calls
    #   Default:  blank (model default)
    display:

  # Web search: web_search must be true to use any other setting in this block.
  #   Docs:     https://platform.claude.com/docs/en/agents-and-tools/tool-use/web-search-tool
  search:
    # Give Claude the web search tool.
    #   Type:     boolean
    #   Default:  false
    web_search: true

    # Web search tool version.
    #   Options:  web_search_20250305  basic search
    #             web_search_20260209  adds dynamic filtering
    #             web_search_20260318  adds response_inclusion
    #   Default:  blank (web_search_20260318, the newest)
    tool_version:

    # Max searches per message.
    #   Type:     integer, 1 or more
    #   Default:  blank (no limit)
    max_uses:

    # Only search these domains, subdomains included.
    # Not with blocked_domains.
    #   Type:     list of strings
    #   Default:  blank (any domain)
    #   Example:  [cdc.gov, who.int]
    allowed_domains:

    # Never search these domains.
    # Not with allowed_domains.
    #   Type:     list of strings
    #   Default:  blank (none)
    #   Example:  [example.com]
    blocked_domains:

    # Approximate location to localise results.
    user_location:
      # City name.
      #   Type:     string
      #   Default:  blank (not sent)
      #   Example:  Minneapolis
      city:

      # Region name.
      #   Type:     string
      #   Default:  blank (not sent)
      #   Example:  Minnesota
      region:

      # Two-letter country code.
      #   Type:     string
      #   Default:  blank (not sent)
      #   Example:  US
      country:

      # IANA time zone.
      #   Type:     string
      #   Default:  blank (not sent)
      #   Example:  America/Chicago
      timezone:

    # Who may run searches.
    # [direct] turns off dynamic filtering; models without programmatic tool calling need it.
    #   Options:  direct | code_execution_20250825 | code_execution_20260120 |
    #             code_execution_20260521
    #   Type:     list of the options above, at least 1
    #   Default:  blank (the tool version's default)
    #   Example:  [direct]
    allowed_callers:

    # Whether results code execution consumed come back.
    # web_search_20260318 only.
    #   Options:  full      return them
    #             excluded  drop them
    #   Default:  blank (full)
    response_inclusion:

    # Whether Claude must search.
    #   Options:  auto  Claude decides
    #             any   Claude must use a tool first; current models reject it
    #   Default:  blank (auto)
    tool_choice:
